name: CI Build

# Triggers on push and branches on the master
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  all:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        build_type : [ Debug, Release ]
        shared_type : [ OFF, ON ]
        device: [ cpu, gpu_nvidia, gpu_amd ]
        exclude:
          - build_type: Release
            shared_type: OFF
    name: "${{matrix.build_type}} Shared=${{matrix.shared_type}} ${{matrix.device}}"
    runs-on: [ "${{matrix.device}}", self-hosted ]
    # Keyed by device so each GPU test job below can be skipped on its own. A
    # matrix leg that does not set a key leaves it empty instead of clobbering
    # the value another leg wrote.
    outputs:
      gpu_nvidia: ${{ steps.gpu_preflight.outputs.gpu_nvidia }}
      gpu_amd: ${{ steps.gpu_preflight.outputs.gpu_amd }}
    env:
      BUILD_TYPE:  ${{matrix.build_type}}
      SHARED_TYPE: ${{matrix.shared_type}}
      DEVICE: ${{matrix.device}}
      BUILD_DIRECTORY: build
      INSTALL_DIRECTORY: install
      SETUP: ${{github.workspace}}/.github/workflows/env_setup.sh
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Build Environment ${{ runner.os }}
      id: setup
      # Create a separate build directory and use it for all subsequent commands
      run: |
          source $SETUP
          cmake -E make_directory ${{ env.BUILD_DIRECTORY }}

    - name: Configure CMake
      id: configure
      working-directory: ${{ env.BUILD_DIRECTORY }}
      # Note the current convention is to use the -S and -B options here to specify source 
      # and build directories, but this is only available with CMake 3.13 and higher.  
      # The CMake binaries on the Github Actions machines are (as of this writing) 3.12
      run: |
        source $SETUP
        CC=gcc CXX=g++ FC=gfortran cmake $GITHUB_WORKSPACE $BUILD_CONFIG
        CC=gcc CXX=g++ FC=gfortran cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE $BUILD_CONFIG

    - name: Build
      working-directory: ${{ env.BUILD_DIRECTORY }}
      run: |
        source $SETUP
        cmake --build .

    - name: Install
      working-directory: ${{ env.BUILD_DIRECTORY }}
      run: |
          source $SETUP
          cmake --build . --target install

    - name: GPU Preflight
      id: gpu_preflight
      if: ${{ startsWith(matrix.build_type, 'Release') && startsWith(matrix.device, 'gpu') }}
      working-directory: ${{ env.BUILD_DIRECTORY }}
      # A single tiny gemm on one device tells us whether this runner can execute
      # GPU kernels at all. An empty GPU_UNUSABLE_RE would match every line and
      # turn any failure into a skip, so demand a non-empty pattern.
      run: |
        source $SETUP
        if ctest --output-on-failure -L '^gpuprobe$' >probe.log 2>&1; then
          verdict=usable
        elif [ -n "$GPU_UNUSABLE_RE" ] && grep -Eq "$GPU_UNUSABLE_RE" probe.log; then
          verdict=unusable
        else
          verdict=broken
        fi
        echo "verdict=$verdict" >> $GITHUB_OUTPUT
        echo "${{ matrix.device }}=$verdict" >> $GITHUB_OUTPUT
        cat probe.log

    - name: Test
      if: ${{ startsWith(matrix.build_type, 'Release') }}
      working-directory: ${{ env.BUILD_DIRECTORY }}
      # Execute tests defined by the CMake configuration.  
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      # run: ctest -C $BUILD_TYPE
      # The gpu tests run in their own job so that an unusable runner reports
      # them as skipped rather than as part of a green run. lowmem tests are
      # busted atm.
      run: |
        source $SETUP
        ctest --output-on-failure -R 'launcher|dplasma' -E lowmem -LE '^gpu$'

    - name: GPU Preflight Verdict
      if: ${{ startsWith(matrix.build_type, 'Release') && startsWith(matrix.device, 'gpu') }}
      # Runs after the rest of the suite so that a broken probe still leaves us
      # the non-GPU results.
      run: |
        case "${{ steps.gpu_preflight.outputs.verdict }}" in
          unusable)
            echo "::warning title=GPU tests skipped::The ${{ matrix.device }} runner cannot execute GPU kernels; the gpu tests were not run."
            echo "### GPU tests skipped on ${{ matrix.device }}" >> $GITHUB_STEP_SUMMARY
            echo 'The GPU preflight failed with a known environment error, so the `gpu`-labelled tests were skipped. Everything else ran normally.' >> $GITHUB_STEP_SUMMARY
            ;;
          broken)
            echo "::error title=GPU preflight failed::The GPU probe failed for an unrecognized reason, so it is treated as a real failure rather than an unusable runner."
            exit 1
            ;;
        esac

    - name: Save Artifact
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: CMake-error-log
        path: ${{ env.BUILD_DIRECTORY }}/CMakeFiles/CMakeError.log

  # The gpu tests live in their own job purely so that GitHub can report them
  # as skipped when the runner cannot execute GPU kernels, instead of folding
  # their absence into a green build job. A job-level `if` cannot see `matrix`,
  # so these are spelled out per device rather than generated from one.
  gpu_tests_nvidia:
    needs: all
    # Not plain `needs` success: an unrelated matrix leg failing must not make
    # these show up as skipped, which would read as "the GPU is unusable".
    if: ${{ !cancelled() && needs.all.outputs.gpu_nvidia == 'usable' }}
    name: "GPU tests gpu_nvidia"
    timeout-minutes: 60
    runs-on: [ gpu_nvidia, self-hosted ]
    env:
      BUILD_TYPE: Release
      SHARED_TYPE: ON
      DEVICE: gpu_nvidia
      BUILD_DIRECTORY: build
      INSTALL_DIRECTORY: install
      SETUP: ${{github.workspace}}/.github/workflows/env_setup.sh
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Build Environment ${{ runner.os }}
      run: |
          source $SETUP
          cmake -E make_directory ${{ env.BUILD_DIRECTORY }}

    - name: Configure CMake
      working-directory: ${{ env.BUILD_DIRECTORY }}
      run: |
        source $SETUP
        CC=gcc CXX=g++ FC=gfortran cmake $GITHUB_WORKSPACE $BUILD_CONFIG
        CC=gcc CXX=g++ FC=gfortran cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE $BUILD_CONFIG

    - name: Build
      working-directory: ${{ env.BUILD_DIRECTORY }}
      run: |
        source $SETUP
        cmake --build .

    - name: Test
      working-directory: ${{ env.BUILD_DIRECTORY }}
      # ctest pulls the blas thread-safety and gpu probe fixtures in on its own,
      # even though neither matches this filter.
      run: |
        source $SETUP
        ctest --output-on-failure -L '^gpu$' -E lowmem

  gpu_tests_amd:
    needs: all
    if: ${{ !cancelled() && needs.all.outputs.gpu_amd == 'usable' }}
    name: "GPU tests gpu_amd"
    timeout-minutes: 60
    runs-on: [ gpu_amd, self-hosted ]
    env:
      BUILD_TYPE: Release
      SHARED_TYPE: ON
      DEVICE: gpu_amd
      BUILD_DIRECTORY: build
      INSTALL_DIRECTORY: install
      SETUP: ${{github.workspace}}/.github/workflows/env_setup.sh
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Build Environment ${{ runner.os }}
      run: |
          source $SETUP
          cmake -E make_directory ${{ env.BUILD_DIRECTORY }}

    - name: Configure CMake
      working-directory: ${{ env.BUILD_DIRECTORY }}
      run: |
        source $SETUP
        CC=gcc CXX=g++ FC=gfortran cmake $GITHUB_WORKSPACE $BUILD_CONFIG
        CC=gcc CXX=g++ FC=gfortran cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE $BUILD_CONFIG

    - name: Build
      working-directory: ${{ env.BUILD_DIRECTORY }}
      run: |
        source $SETUP
        cmake --build .

    - name: Test
      working-directory: ${{ env.BUILD_DIRECTORY }}
      # ctest pulls the blas thread-safety and gpu probe fixtures in on its own,
      # even though neither matches this filter.
      run: |
        source $SETUP
        ctest --output-on-failure -L '^gpu$' -E lowmem
