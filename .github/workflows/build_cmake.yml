name: CI Build

# Triggers on push and branches on the master
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  all:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        build_type : [ Debug ]
        shared_type : [ ON ]
        device: [ cpu, gpu_nvidia ]
    name: "${{matrix.build_type}} Shared=${{matrix.shared_type}} ${{matrix.device}}"
    runs-on: [ "${{matrix.device}}", self-hosted ]
    env:
      BUILD_TYPE:  ${{matrix.build_type}}
      SHARED_TYPE: ${{matrix.shared_type}}
      DEVICE: ${{matrix.device}}
      BUILD_DIRECTORY: build
      INSTALL_DIRECTORY: install
      # Job-wide: CMake's try_run probes are sanitized too, and would fail on
      # leaks alone before we ever reach the test.
      ASAN_OPTIONS: detect_leaks=0:print_stacktrace=1
      SETUP: ${{github.workspace}}/.github/workflows/env_setup.sh
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Build Environment ${{ runner.os }}
      id: setup
      # Create a separate build directory and use it for all subsequent commands
      run: |
          source $SETUP
          cmake -E make_directory ${{ env.BUILD_DIRECTORY }}

    - name: Configure CMake
      id: configure
      working-directory: ${{ env.BUILD_DIRECTORY }}
      # Note the current convention is to use the -S and -B options here to specify source 
      # and build directories, but this is only available with CMake 3.13 and higher.  
      # The CMake binaries on the Github Actions machines are (as of this writing) 3.12
      run: |
        source $SETUP
        CC=gcc CXX=g++ FC=gfortran cmake $GITHUB_WORKSPACE $BUILD_CONFIG
        CC=gcc CXX=g++ FC=gfortran cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE $BUILD_CONFIG

    - name: Build
      working-directory: ${{ env.BUILD_DIRECTORY }}
      run: |
        source $SETUP
        cmake --build .

    - name: Install
      working-directory: ${{ env.BUILD_DIRECTORY }}
      run: |
          source $SETUP
          cmake --build . --target install

    - name: Describe the machine
      working-directory: ${{ env.BUILD_DIRECTORY }}
      # Results here only mean something alongside the host they ran on: the
      # runners differ by an order of magnitude in core count, and the failure
      # we are chasing has only ever appeared on the large ones.
      run: |
        echo "runner=${{ runner.name }} host=$(hostname) nproc=$(nproc)"

    - name: Test
      working-directory: ${{ env.BUILD_DIRECTORY }}
      # Investigation only. The tester prints a fingerprint of the
      # factorization output and of the solve output; comparing a passing
      # attempt against a failing one on the same machine says whether getrf
      # or getrs produces the wrong answer. Keep going past a failure so we
      # collect both, and report at the end whether any attempt failed.
      run: |
        source $SETUP
        rc=0
        for i in $(seq 1 10); do
          echo "===== attempt $i ====="
          ctest --output-on-failure -R 'dgetrf_1d_mpi' -V || rc=1
        done
        exit $rc

    - name: Save Artifact
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: CMake-error-log
        path: ${{ env.BUILD_DIRECTORY }}/CMakeFiles/CMakeError.log
